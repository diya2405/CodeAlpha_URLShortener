<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener — CodeAlpha</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p { color: #94a3b8; margin-bottom: 30px; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #334155;
            border-radius: 10px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #38bdf8; }
        button {
            padding: 14px 24px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #0ea5e9; }
        .result {
            background: #0f172a;
            border: 2px solid #38bdf8;
            border-radius: 10px;
            padding: 16px 20px;
            display: none;
            margin-bottom: 24px;
        }
        .result p { color: #94a3b8; margin-bottom: 6px; font-size: 13px; }
        .result a {
            color: #38bdf8;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
        }
        .copy-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #334155;
            color: #e2e8f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .history { margin-top: 10px; }
        .history h3 { color: #94a3b8; font-size: 14px; margin-bottom: 12px; }
        .url-item {
            background: #0f172a;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .url-item a { color: #38bdf8; text-decoration: none; }
        .url-item .original { color: #64748b; margin-top: 4px; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔗 URL Shortener</h1>
    <p>Paste your long URL and get a short one instantly</p>

    <div class="input-group">
        <input type="text" id="urlInput" placeholder="https://your-long-url.com/very/long/path"/>
        <br><input type="text" id="customCode" placeholder="Custom name (optional) e.g. my-portfolio"/>
        <br>
        <button onclick="shortenURL()">Shorten</button>
    </div>

    <div class="result" id="result">
        <p>Your shortened URL:</p>
        <a id="shortUrl" href="#" target="_blank"></a><br>
        <button class="copy-btn" onclick="copyURL()">Copy</button>
    </div>

    <div class="history" id="history"></div>
</div>

<script>
async function shortenURL() {
    const url = document.getElementById('urlInput').value.trim();
    const custom_code = document.getElementById('customCode').value.trim();
    if (!url) return alert('Please enter a URL');

    const res = await fetch('/shorten', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url, custom_code})
    });
    const data = await res.json();
    if (data.error) return alert(data.error);  // shows "already taken" etc.

    document.getElementById('shortUrl').href = data.short_url;
    document.getElementById('shortUrl').textContent = data.short_url;
    document.getElementById('result').style.display = 'block';
    loadHistory();
}

function copyURL() {
    const url = document.getElementById('shortUrl').textContent;
    navigator.clipboard.writeText(url);
    alert('Copied!');
}

async function loadHistory() {
    const res = await fetch('/all');
    const urls = await res.json();
    
    const history = document.getElementById('history');
    if (urls.length === 0) return;
    
    history.innerHTML = '<h3>Recent URLs</h3>' + urls.reverse().slice(0,5).map(u => `
        <div class="url-item">
            <a href="${u.short_url}" target="_blank">${u.short_url}</a>
            <div class="original">${u.original_url}</div>
        </div>
    `).join('');
}

loadHistory();
</script>
</body>
</html>
